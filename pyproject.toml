[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncs-method"
version = "1.0.0"
description = "Explicit-estimand, patient/action/channel-paired NCS numerical analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["ncs_method*"]
